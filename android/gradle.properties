# ذاكرة البناء على جهازٍ بـ8 جيجا.
#
# كان هنا 4G لآلة Gradle و2G لآلة Kotlin منفصلة، ومعهما 1G للـMetaspace: سبعة
# من ثمانية محجوزةٌ قبل أن يبدأ البناء. وويندوز يحجز لكلّ ذلك في ملفّ الترحيل
# حجزًا فوريًّا لا كسولًا، فيُستنفد المتاح ويسقط أوّل طلبٍ يأتي بعده
# (`The paging file is too small`) — ويظهر السقوط «خطأ ترجمة» لأن عامل Kotlin
# يموت في أثناء عمله، لا لأن في الشفرة علّة.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# Kotlin داخل آلة Gradle نفسها لا في آلةٍ ثانية: الترجمة أبطأ قليلًا، لكن
# آلةً واحدة بثلاثة جيجا تَسَع ما لا تسعه آلتان بستّة.
kotlin.compiler.execution.strategy=in-process

# وحدتان متوازيتان لا عدد الأنوية: التوازي الكامل يفتح عدّة مترجمات معًا،
# وذروة الذاكرة هي مجموعها لا أكبرها.
org.gradle.parallel=false
org.gradle.workers.max=2

android.useAndroidX=true
