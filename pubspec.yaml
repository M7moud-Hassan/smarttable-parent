name: smartble_parent
description: "تطبيق ولي الأمر — الجدول الذكي (Smartble Parent)."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  get: ^4.6.6
  shared_preferences: ^2.3.2
  flutter_svg: ^2.0.10+1
  dio: ^5.7.0
  flutter_easyloading: ^3.0.5
  logger: ^2.4.0
  internet_connection_checker_plus: ^2.2.0
  get_it: ^8.0.2
  dartz: ^0.10.1
  equatable: ^2.0.5
  easy_localization: ^3.0.7

  # الإشعارات — نفس حزم تطبيق المدير (adary).
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^18.0.0
  bloc: ^8.1.4
  flutter_bloc: ^8.1.6
  image_picker: ^1.2.1
  file_picker: ^8.1.3
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  cached_network_image: ^3.4.1
  path_provider: ^2.1.5
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/logo.png"
  min_sdk_android: 21
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lang/

  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-300.ttf
          weight: 300
        - asset: assets/fonts/IBMPlexSansArabic-400.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-500.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-600.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-700.ttf
          weight: 700
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-700.ttf
          weight: 700
        - asset: assets/fonts/Cairo-800.ttf
          weight: 800
